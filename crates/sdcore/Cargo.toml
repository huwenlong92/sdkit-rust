[package]
name = "sdcore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reusable Rust web tool application core"

[features]
default = ["sqlite", "auth", "sse", "static-embed", "task"]
sqlite = ["dep:sqlx", "sqlx/macros", "sqlx/runtime-tokio", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/macros", "sqlx/postgres", "sqlx/runtime-tokio", "sqlx/tls-rustls"]
auth = ["dep:hex", "dep:sha2", "dep:argon2", "dep:rand_core"]
sse = []
static-embed = []
task = []
systemd = []

[dependencies]
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
toml = "0.8"
axum = "0.8"
async-stream = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-core = "0.3"
hex = { version = "0.4", optional = true }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.8", default-features = false, optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
